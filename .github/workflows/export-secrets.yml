name: Export GitHub Secrets

on:
  workflow_dispatch:  # Manual trigger

permissions:
  actions: read  # Required to access secrets
  contents: read

jobs:
  export-secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch and Save Secrets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          echo "Fetching secrets..."
          
          # Get Org Secrets
          echo '{"org_secrets":' > secrets.json
          curl -s -H "Authorization: Bearer $GH_TOKEN" \
               -H "Accept: application/vnd.github+json" \
               "https://api.github.com/orgs/$OWNER/actions/secrets" | jq '.secrets' >> secrets.json
          
          echo ',"repo_secrets":' >> secrets.json
          # Get Repo Secrets
          curl -s -H "Authorization: Bearer $GH_TOKEN" \
               -H "Accept: application/vnd.github+json" \
               "https://api.github.com/repos/$OWNER/$REPO/actions/secrets" | jq '.secrets' >> secrets.json
          
          echo ',"environment_secrets":{' >> secrets.json
          
          # Get Environment Secrets
          ENVIRONMENTS=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
                          -H "Accept: application/vnd.github+json" \
                          "https://api.github.com/repos/$OWNER/$REPO/environments" | jq -r '.environments[].name')
          
          for ENV in $ENVIRONMENTS; do
            echo "\"$ENV\": " >> secrets.json
            curl -s -H "Authorization: Bearer $GH_TOKEN" \
                 -H "Accept: application/vnd.github+json" \
                 "https://api.github.com/repos/$OWNER/$REPO/environments/$ENV/secrets" | jq '.secrets' >> secrets.json
            echo "," >> secrets.json
          done
          
          # Remove last comma and close JSON
          sed -i '$ s/,$//' secrets.json
          echo '}}' >> secrets.json

          cat secrets.json  # Print for debugging

      - name: Upload Secrets as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-secrets
          path: secrets.json
          retention-days: 7  # Store for 7 days
