name: Export GitHub Secrets

on:
  workflow_dispatch:  # Manual trigger

jobs:
  export-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Export Secrets to File
        run: |
          echo '{' > secrets.json
          echo '  "GITHUB_TOKEN": "${{ secrets.GITHUB_TOKEN }}",' >> secrets.json
          echo '  "OWNER": "${{ secrets.OWNER }}",' >> secrets.json
          echo '  "REPO": "${{ secrets.REPO }}",' >> secrets.json
          echo '  "ENVIRONMENT": "${{ secrets.ENVIRONMENT }}"' >> secrets.json
          echo '}' >> secrets.json
          
          cat secrets.json  # Print the file (optional)

      - name: Upload Secrets as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-secrets
          path: secrets.json
          retention-days: 7  # Store artifact for 7 days
