name: Manual Trigger Workflow

on:
  workflow_dispatch:  # This enables manual trigger

jobs:
  get-user:
    runs-on: ubuntu-latest
    steps:
      - name: Print the user who triggered the workflow
        run: |
          echo "Workflow triggered by: ${{ github.actor }}"
        
      - name: Fetch user details from GitHub API
        run: |
          echo "Fetching details for ${{ github.actor }}..."
          curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
               -H "Accept: application/vnd.github.v3+json" \
               https://api.github.com/users/${{ github.actor }} \
               | jq '.' > user_details.json

      - name: Display user details
        run: cat user_details.json

      - name: Upload user details as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: user-details
          path: user_details.json
