name: Handle List Input

on:
  workflow_dispatch:
    inputs:
      tags:
        description: "List of tags separated by ;"
        required: false
        default: "@tag1;@tag2;@tag3"
        type: string

jobs:
  process_list:
    runs-on: ubuntu-latest

    steps:
      - name: Show Input Value
        run: |
          echo "Raw Tags Input: ${{ inputs.tags }}"
        
      - name: Convert List to Array
        run: |
          IFS=";" read -r -a TAGS_ARRAY <<< "${{ inputs.tags }}"
          echo "Parsed Tags: ${TAGS_ARRAY[@]}"
          
          # Optional: Export each tag separately
          for tag in "${TAGS_ARRAY[@]}"; do
            echo "Tag: $tag"
          done
          
      - name: Convert to Space-Separated String and Count
        run: |
          SPACE_SEPARATED_TAGS=$(echo "${{ inputs.tags }}" | tr ';' ' ')
          TAG_COUNT=$(echo $SPACE_SEPARATED_TAGS | wc -w)
          
          echo "Converted Tags: $SPACE_SEPARATED_TAGS"
          echo "Number of Tags: $TAG_COUNT"

          # Export as environment variables (optional)
          echo "TAGS=$SPACE_SEPARATED_TAGS" >> $GITHUB_ENV
          echo "TAG_COUNT=$TAG_COUNT" >> $GITHUB_ENV

      - name: Use Counted Tags
        run: |
          echo "Total Tags: $TAG_COUNT"
          echo "Tags: $TAGS"
