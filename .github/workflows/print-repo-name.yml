name: Print GitHub Repo Name

on:
  workflow_dispatch:  # Enables manual triggering from the GitHub UI
  push:
    branches:
      - develop
      - 'release/**'

jobs:
  print-repo-name:
    runs-on: ubuntu-latest

    steps:
      - name: Print full repository name (owner/repo)
        run: |
          echo "Full repo name: ${{ github.repository }}"

      - name: Extract and print only the repo name
        run: |
          REPO="${{ github.repository }}"
          REPO_NAME="${REPO##*/}"
          echo "Repo name only: $REPO_NAME"

      - name: Print complete repository details
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO_URL="https://api.github.com/repos/${{ github.repository }}"
          echo "Fetching repository details from $REPO_URL"
          curl -H "Authorization: token $GH_TOKEN" -s "$REPO_URL"
