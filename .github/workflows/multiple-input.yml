name: Parse Repos and Tags

on:
  workflow_dispatch:
    inputs:
      repo_tags:
        description: 'Enter repo:tag1,tag2 per line (multiline supported)'
        required: true
        default: |
          repo1:tag1,tag2
          repo2:tag3,tag4
          repo3:tagA

jobs:
  parse-and-print:
    runs-on: ubuntu-latest
    steps:
      - name: Parse and Print Repos and Tags
        run: |
          echo "Parsing repos and tags..."

          # Convert escaped \n characters into real newlines
          INPUT=$(echo -e "${{ github.event.inputs.repo_tags }}")

          while IFS= read -r line; do
            # Skip empty lines
            [ -z "$line" ] && continue

            repo=$(echo "$line" | cut -d':' -f1)
            tags=$(echo "$line" | cut -d':' -f2)

            echo "Repo: $repo"

            IFS=',' read -ra tag_array <<< "$tags"
            for tag in "${tag_array[@]}"; do
              echo "  - Tag: $tag"
            done
          done <<< "$INPUT"
